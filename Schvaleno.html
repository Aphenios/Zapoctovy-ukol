<html lang="cs">
<head>

  <title>Gratuluji ke správnému rozhodnutí</title>
  <style>

      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: #dff0d8; /* jemná zelená barva */

      font-size: 2em;
      color: #3c763d;
    }

<body>

<div class="zprava">
  Děkuji za udělení zápočtu! 🎓<br>
