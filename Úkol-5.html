<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Úkol-5-design.css">
    <title>Úkol 5</title>
</head>
<body>
    <h1>Cvičení 5: Domek, vlajky, šipka v SVG</h1>

    <section class="tabulka">
        <div class="bunka">
            <div class="popisek">Domek jednou čarou
            <svg viewBox="0 0 100 100">
                <polyline points="10,90 90,90 10,40 90,40 50,10 10,40 10,90 90,40 90,90" fill="none" stroke="black" stroke-width="2"/>
            </svg></div>
        </div>
        <div class="bunka">
            <div class="popisek">Česká vlajka
            <svg viewBox="0 0 300 200">
                <rect x="0" y="0" width="300" height="100" fill="rgb(255,255,255)"/>
                <rect x="0" y="100" width="300" height="100" fill="rgb(215,20,26)"/>
                <polygon points="0,0 150,100 0,200" fill="rgb(17,69,126)"/>
            </svg></div>
        </div>
        <div class="bunka">
            <div class="popisek">Švédská vlajka
            <svg viewBox="0 0 320 200">
                <rect x="0" y="0" width="320" height="200" fill="rgb(0,82,147)"/>
                <polygon points="0,80 100,80 100,0 140,0 140,80 320,80 320,120 140,120 140,200 100,200 100,120 0,120 0,80" fill="rgb(254,203,0)"/>
            </svg></div>
        </div>
        <div class="bunka">
            <div class="popisek">Šipka/y
            <a href="https://example.com" target="example">
            <svg viewBox="0 0 100 100" >
                <polyline class="sipka" points="0,40 50,40 50,10 90,50 50,90 50,60 0,60 0,40" fill="lime" stroke="green" stroke-width="1"/>
            </svg></div>
        </div>


    </section>
    

</body>
</html>
